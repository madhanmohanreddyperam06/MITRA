services:
  - type: web
    name: mitra-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mitra-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://mitra-frontend.onrender.com

  - type: web
    name: mitra-frontend
    env: python
    buildCommand: cd frontend && pip install -r requirements.txt
    startCommand: cd frontend && streamlit run main.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: BACKEND_URL
        value: https://mitra-backend.onrender.com

databases:
  - name: mitra-db
    databaseName: mitra_db
    user: mitra_user
