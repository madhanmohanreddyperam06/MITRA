services:
  - type: web
    name: mitra-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m spacy download en_core_web_sm && cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mitra-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.onrender.com

databases:
  - name: mitra-db
    databaseName: mitra_db
    user: mitra_user
